<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Poptag-Viewer</title>
  <style>
    :root {
      --bg:#080b12; --panel:#101624; --panel2:#171f31; --line:#28364e;
      --text:#f4f7fb; --muted:#9aa8bd; --cyan:#62e4ff; --yellow:#ffdf63;
      --card:270px; --thumb:180px;
    }
    * { box-sizing:border-box; }
    html { scrollbar-color:#42516c #0b0f18; }
    body { margin:0; color:var(--text); background:radial-gradient(circle at 75% -10%,#173150 0,transparent 32rem),var(--bg); font-family:"Malgun Gothic","Noto Sans KR",system-ui,sans-serif; }
    button,input,select { font:inherit; }
    button { color:inherit; }
    button:disabled { opacity:.48; cursor:not-allowed; }
    header { position:sticky; top:0; z-index:20; padding:18px 24px 14px; background:rgba(8,11,18,.94); border-bottom:1px solid var(--line); backdrop-filter:blur(18px); }
    .top { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:14px; padding-right:108px; }
    .brand-line { display:flex; align-items:center; gap:14px; min-width:0; }
    h1 { margin:0; font-size:clamp(1.35rem,3vw,2rem); letter-spacing:-.04em; }
    .count { color:var(--cyan); font-weight:800; }
    .language-switch { position:fixed; top:14px; right:24px; z-index:110; display:flex; gap:3px; padding:4px; background:#0d1422; border:1px solid #34435b; border-radius:11px; box-shadow:0 8px 24px rgba(0,0,0,.28); }
    .language-switch button { min-width:42px; min-height:32px; padding:0 9px; color:var(--muted); background:transparent; border:0; border-radius:7px; cursor:pointer; font-size:.8rem; font-weight:900; }
    .language-switch button:hover { color:var(--text); background:#172238; }
    .language-switch button.active { color:#061017; background:var(--cyan); }
    .tryon-button { min-height:48px; padding:0 24px; color:#061017; background:linear-gradient(135deg,#75ebff,#43d5f5); border:1px solid #8ff0ff; border-radius:13px; cursor:pointer; box-shadow:0 8px 24px rgba(76,218,247,.22),inset 0 1px rgba(255,255,255,.45); font-size:1.02rem; font-weight:900; white-space:nowrap; transition:.16s transform,.16s box-shadow; }
    .tryon-button:hover { transform:translateY(-2px); box-shadow:0 12px 30px rgba(76,218,247,.32),inset 0 1px rgba(255,255,255,.5); }
    .tryon-button.active { color:#fff; background:linear-gradient(135deg,#276486,#173e62); border-color:var(--cyan); }
    .tab-stack { display:grid; gap:7px; margin-bottom:12px; }
    .tabs { display:flex; gap:7px; margin:0; overflow-x:auto; scrollbar-width:thin; }
    .tab { min-height:40px; padding:0 16px; color:var(--muted); background:#111827; border:1px solid var(--line); border-radius:999px; cursor:pointer; white-space:nowrap; font-weight:800; }
    .tab.active { color:#071019; background:var(--cyan); border-color:var(--cyan); }
    .controls { display:grid; grid-template-columns:minmax(220px,1fr) auto auto auto; gap:9px; }
    .control { min-height:44px; color:var(--text); background:var(--panel); border:1px solid var(--line); border-radius:11px; padding:0 13px; }
    .character-filter { min-width:220px; }
    .character-filter[hidden] { display:none; }
    input:focus,select:focus,button:focus-visible { outline:2px solid var(--cyan); outline-offset:2px; }
    main { padding:22px 24px 80px; }
    #grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,var(--card)),1fr)); gap:14px; }
    .card { min-width:0; padding:0; overflow:hidden; text-align:left; color:inherit; background:linear-gradient(145deg,var(--panel2),var(--panel)); border:1px solid var(--line); border-radius:14px; cursor:pointer; box-shadow:0 10px 30px rgba(0,0,0,.18); transition:.16s transform,.16s border-color,.16s box-shadow; }
    .card:hover { transform:translateY(-3px); border-color:#527195; box-shadow:0 14px 35px rgba(0,0,0,.3); }
    .card.catalog-focus { border-color:var(--cyan); box-shadow:0 0 0 3px rgba(98,228,255,.28),0 18px 48px rgba(0,0,0,.42); animation:catalog-focus 1.8s ease-out; }
    @keyframes catalog-focus { 0%,35% { transform:translateY(-4px) scale(1.015); } 100% { transform:none; } }
    .preview-shell,.full-shell,.stage,.id-deco-stage { background-color:#dfe5ec; background-image:linear-gradient(45deg,#b8c2cd 25%,transparent 25%),linear-gradient(-45deg,#b8c2cd 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#b8c2cd 75%),linear-gradient(-45deg,transparent 75%,#b8c2cd 75%); background-size:16px 16px; background-position:0 0,0 8px,8px -8px,-8px 0; }
    .preview-shell { height:var(--thumb); min-width:0; min-height:0; display:grid; place-items:center; overflow:hidden; padding:10px; border-bottom:1px solid var(--line); }
    .preview-shell.id-deco-preview { height:max(112px,calc(var(--thumb) * .58)); padding:8px 10px 10px; }
    .thumb { width:auto; height:100%; max-width:100%; max-height:100%; aspect-ratio:1; display:block; image-rendering:pixelated; }
    .id-deco-palette { width:100%; min-width:0; display:grid; gap:7px; }
    .palette-labels { display:grid; grid-template-columns:1fr 1fr; gap:16px; color:#52627a; font-size:.72rem; font-weight:900; text-align:center; }
    .palette-labels span { min-width:0; }
    .palette-labels[hidden] { display:none; }
    .id-deco-canvas { width:100%; height:auto; max-width:100%; aspect-ratio:95 / 22; display:block; image-rendering:pixelated; }
    .body { padding:12px 13px 14px; }
    .row { display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .code { min-width:0; color:var(--yellow); font-size:1.02rem; font-weight:900; letter-spacing:.025em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .badge { flex:0 0 auto; padding:4px 7px; border-radius:999px; color:#c2d3ea; background:#202b40; font-size:.75rem; }
    .name { height:2.8em; margin-top:8px; line-height:1.4; overflow:hidden; font-size:.9rem; overflow-wrap:anywhere; }
    .resource { margin-top:8px; color:var(--muted); font:.76rem/1.3 ui-monospace,Consolas,monospace; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .unlinked { border-color:#5b4535; }
    .unlinked .name { color:#deb583; }
    .empty { grid-column:1/-1; padding:16vh 20px; text-align:center; color:var(--muted); }
    body.dressing-room-active { background:radial-gradient(circle at 28% 0,#173650 0,transparent 34rem),var(--bg); }
    body.dressing-room-active header { position:relative; }
    body.dressing-room-active main { padding-top:18px; }
    #composer { display:none; grid-template-columns:minmax(520px,1.45fr) minmax(410px,.72fr); align-items:start; gap:18px; max-width:1760px; margin:0 auto; }
    .pick-panel,.preview-palette { min-width:0; background:linear-gradient(145deg,var(--panel2),var(--panel)); border:1px solid var(--line); border-radius:16px; box-shadow:0 18px 44px rgba(0,0,0,.2); }
    .preview-palette { overflow:hidden; }
    .composer-sidebar { min-width:0; display:grid; gap:16px; }
    .preview-board-head { display:flex; align-items:center; justify-content:space-between; gap:16px; min-height:58px; padding:13px 16px; border-bottom:1px solid var(--line); background:rgba(8,13,23,.52); }
    .preview-board-head h2 { margin:0; font-size:1.08rem; letter-spacing:-.02em; }
    .preview-workspace { display:grid; grid-template-columns:minmax(250px,.72fr) minmax(340px,1.28fr); grid-template-areas:"movement movement" "slot id"; align-items:stretch; gap:14px; padding:14px; }
    .preview-zone,.id-deco-zone { min-width:0; padding:14px; background:rgba(7,12,21,.55); border:1px solid #253550; border-radius:14px; }
    .slot-zone { grid-area:slot; }
    .movement-zone { grid-area:movement; }
    .preview-zone-title { display:flex; align-items:center; gap:9px; min-height:32px; margin-bottom:12px; }
    .preview-zone-title h2 { margin:0; color:var(--cyan); font-size:1rem; }
    .stage { width:min(100%,340px); aspect-ratio:1; margin:auto; overflow:hidden; border:1px solid #526580; border-radius:12px; background-size:24px 24px; background-position:0 0,0 12px,12px -12px,-12px 0; }
    #stage-canvas { width:100%; height:100%; display:block; image-rendering:pixelated; }
    .picker { margin-bottom:15px; }
    .picker label { display:block; margin-bottom:6px; color:var(--yellow); font-weight:800; }
    .picker-label-row { display:flex; align-items:center; gap:6px; min-height:28px; margin-bottom:6px; }
    .picker-label-row label { margin:0; }
    .category-list-button { width:28px; height:28px; flex:0 0 auto; display:inline-grid; place-items:center; padding:0; color:#b9c8dc; background:#111a2a; border:1px solid #3a4963; border-radius:8px; cursor:pointer; transition:.14s color,.14s background,.14s border-color,.14s transform; }
    .category-list-button:hover { color:#061017; background:var(--cyan); border-color:var(--cyan); transform:translateY(-1px); }
    .category-list-button svg { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; }
    .picker select { width:100%; min-height:45px; color:var(--text); background:#0f1624; border:1px solid var(--line); border-radius:10px; padding:0 10px; }
    .picker select:disabled { color:#738096; cursor:not-allowed; }
    .character-panel,.item-panel { overflow:hidden; }
    .panel-heading { min-height:52px; display:flex; align-items:center; padding:12px 16px; background:rgba(8,13,23,.46); border-bottom:1px solid var(--line); }
    .panel-heading h2 { margin:0; color:var(--cyan); font-size:1rem; letter-spacing:-.02em; }
    .character-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; padding:16px; }
    .picker-section { padding:16px; }
    .picker-section + .picker-section { border-top:1px solid var(--line); }
    .picker-section h2 { margin:0 0 14px; color:var(--cyan); font-size:1rem; }
    .costume-grid,#pickers,.preview-picker-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
    #field-pickers { display:contents; }
    .character-grid .picker,.costume-grid .picker,#pickers .picker,.preview-picker-grid .picker { margin-bottom:0; }
    .color-choice { display:grid; grid-template-columns:minmax(0,1fr) 45px; gap:8px; }
    .color-swatch { border:1px solid #526580; border-radius:10px; box-shadow:inset 0 0 0 4px rgba(255,255,255,.1); }
    .render-button,.primary { width:100%; min-height:48px; color:#061017; background:var(--cyan); border:0; border-radius:11px; cursor:pointer; font-weight:900; }
    .title-gif-button { width:auto; min-width:54px; min-height:32px; padding:0 10px; border-radius:9px; font-size:.82rem; line-height:1; }
    .title-gif-button:disabled { cursor:not-allowed; opacity:.42; }
    .movement-head { display:flex; align-items:center; justify-content:space-between; gap:16px; min-height:28px; margin-bottom:12px; }
    .movement-head h2 { margin:0; color:var(--cyan); font-size:1rem; }
    .movement-scale-control { display:flex; align-items:center; gap:4px; padding:3px; color:var(--muted); background:#0b111d; border:1px solid #34435b; border-radius:10px; font-size:.78rem; font-weight:900; }
    .movement-scale-control > span { padding:0 7px 0 5px; white-space:nowrap; }
    .movement-scale-control button { min-width:45px; min-height:30px; padding:0 8px; color:var(--muted); background:transparent; border:0; border-radius:7px; cursor:pointer; font-size:.8rem; font-weight:900; }
    .movement-scale-control button:hover { color:var(--text); background:#172238; }
    .movement-scale-control button.active { color:#061017; background:var(--cyan); box-shadow:0 3px 12px rgba(98,228,255,.22); }
    .movement-canvas-wrap { position:relative; width:100%; aspect-ratio:16/9; overflow:hidden; border:1px solid #8a6416; border-radius:12px; background-color:#b8861e; background-image:none; background-repeat:repeat; background-position:0 0; image-rendering:pixelated; }
    #movement-canvas { width:100%; height:100%; display:block; image-rendering:pixelated; }
    #movement-canvas:focus-visible { outline:3px solid var(--cyan); outline-offset:-4px; }
    .movement-empty { position:absolute; inset:0; display:grid; place-items:center; margin:0; color:#53647b; font-weight:900; pointer-events:none; }
    .movement-empty[hidden] { display:none; }
    .id-deco-zone { grid-area:id; display:flex; min-width:0; flex-direction:column; }
    .id-deco-zone .id-deco-palette { width:100%; margin:auto; }
    .id-deco-zone .id-deco-palette > .palette-labels { padding:0 15px; }
    .id-deco-stage { width:100%; overflow:hidden; padding:14px; border:1px solid #526580; border-radius:12px; background-size:20px 20px; background-position:0 0,0 10px,10px -10px,-10px 0; }
    #id-deco-canvas { width:100%; }
    dialog { width:min(1180px,94vw); max-height:92vh; padding:0; color:var(--text); background:#0d1320; border:1px solid #435472; border-radius:16px; box-shadow:0 30px 90px #000; }
    dialog::backdrop { background:rgba(0,0,0,.76); backdrop-filter:blur(5px); }
    .modal-head { position:sticky; top:0; z-index:2; display:flex; align-items:center; justify-content:space-between; gap:16px; padding:14px 16px; background:rgba(13,19,32,.96); border-bottom:1px solid var(--line); }
    .modal-title { min-width:0; }
    .modal-title strong { color:var(--yellow); font-size:1.1rem; }
    .modal-title span { display:block; margin-top:3px; color:var(--muted); font-size:.82rem; overflow-wrap:anywhere; }
    .modal-actions { display:flex; align-items:center; gap:8px; }
    .try-button { min-height:42px; padding:0 16px; color:#061017; background:var(--cyan); border:0; border-radius:11px; cursor:pointer; font-weight:900; }
    .close { width:42px; height:42px; flex:0 0 auto; color:white; background:#202b40; border:1px solid #3a4963; border-radius:11px; cursor:pointer; font-size:1.35rem; }
    .modal-content { padding:18px; overflow:auto; }
    .full-shell { width:100%; height:min(62vh,620px); min-width:0; min-height:0; display:grid; place-items:center; overflow:hidden; padding:16px; border-radius:10px; background-size:20px 20px; background-position:0 0,0 10px,10px -10px,-10px 0; }
    .modal-palette { width:100%; height:100%; display:grid; place-items:center; gap:10px; }
    .modal-palette > .palette-labels { width:100%; }
    #modal-canvas { width:auto; height:100%; max-width:100%; max-height:100%; aspect-ratio:1; display:block; image-rendering:pixelated; }
    .full-shell.id-deco-mode { height:min(46vh,390px); }
    .full-shell.id-deco-mode .modal-palette { width:min(100%,920px); height:auto; }
    .full-shell.id-deco-mode #modal-canvas { width:100%; height:auto; aspect-ratio:95 / 22; }
    .details { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin-top:14px; }
    .detail { min-width:0; padding:12px; background:#151d2c; border:1px solid var(--line); border-radius:10px; }
    .detail small { display:block; color:var(--muted); margin-bottom:5px; }
    .detail div { overflow-wrap:anywhere; }
    .resource-gate { position:fixed; inset:0; z-index:100; display:grid; place-items:center; padding:20px; background:rgba(5,8,14,.94); backdrop-filter:blur(16px); }
    .resource-gate.ready { display:none; }
    .resource-gate > .primary { width:min(360px,100%); box-shadow:0 24px 80px #000; }
    @media (min-width:1181px) and (min-height:820px) { .preview-palette { position:sticky; top:18px; max-height:calc(100vh - 36px); overflow:auto; } }
    @media (max-width:1180px) { #composer { grid-template-columns:1fr; max-width:980px; } .composer-sidebar { grid-template-columns:minmax(300px,.72fr) minmax(0,1.28fr); align-items:start; } }
    @media (max-width:760px) { header,main { padding-left:14px; padding-right:14px; } .top { gap:10px; padding-right:90px; } .language-switch { top:12px; right:14px; } .language-switch button { min-width:38px; padding:0 7px; } .brand-line { gap:10px; } .tryon-button { min-height:44px; padding:0 17px; } .count { font-size:.86rem; } .controls { grid-template-columns:1fr 1fr; } .controls input,.character-filter { grid-column:1/-1; } .details { grid-template-columns:1fr 1fr; } .preview-shell { height:min(var(--thumb),70vw); } .preview-shell.id-deco-preview { height:112px; } .preview-workspace { grid-template-columns:1fr; grid-template-areas:"movement" "slot" "id"; padding:10px; } .composer-sidebar { grid-template-columns:1fr; } .character-grid,.costume-grid,#pickers,.preview-picker-grid { grid-template-columns:1fr; row-gap:12px; } .movement-head { align-items:flex-start; flex-direction:column; } .movement-scale-control { align-self:stretch; } .movement-scale-control button { flex:1; } }
  </style>
</head>
<body>
  <div class="language-switch" id="language-switch" role="group" aria-label="언어 선택" data-i18n-aria="language.selector"><button class="active" type="button" data-language="KR" aria-pressed="true">KR</button><button type="button" data-language="EN" aria-pressed="false">EN</button></div>
  <aside class="resource-gate" id="resource-gate" aria-modal="true" role="dialog">
    <button class="primary" id="choose-folder" type="button" data-i18n="folder.select" data-i18n-title="folder.preferred_path" title="기본 경로: C:\nexon\poptag">PopTag 폴더 선택</button>
    <input id="idd-files" type="file" webkitdirectory directory multiple hidden>
  </aside>
  <header>
    <div class="top"><div class="brand-line"><h1>Poptag-Viewer</h1><button class="tryon-button" id="tryon-tab" type="button" data-category="tryon" data-i18n="nav.dressing_room">드레스룸</button></div><div class="count" id="count"></div></div>
    <nav class="tab-stack" aria-label="종류 선택" data-i18n-aria="nav.categories" id="tabs"><div class="tabs" id="base-tabs"></div><div class="tabs" id="costume-tabs"></div><div class="tabs" id="id-deco-tabs"></div></nav>
    <div class="controls" id="controls">
      <input class="control" id="search" type="search" placeholder="번호, 이름, 리소스 검색" data-i18n-placeholder="search.placeholder" autocomplete="off">
      <select class="control" id="sort" aria-label="정렬" data-i18n-aria="sort.label"><option value="code" data-i18n="sort.code">번호순</option><option value="frames" data-i18n="sort.frames">프레임 많은 순</option><option value="name" data-i18n="sort.name">이름순</option></select>
      <select class="control" id="size" aria-label="카드 크기" data-i18n-aria="card_size.label"><option value="170" data-i18n="size.small">작게</option><option value="270" selected data-i18n="size.medium">보통</option><option value="520" data-i18n="size.large">크게</option></select>
      <select class="control character-filter" id="character-filter" aria-label="미리보기 캐릭터" data-i18n-aria="character.preview_filter" hidden><option value="">전체 캐릭터</option></select>
    </div>
  </header>
  <main>
    <section id="grid" aria-live="polite"></section>
    <section id="composer">
      <div class="preview-palette"><div class="preview-board-head"><h2 data-i18n="preview.workspace">미리보기</h2></div><div class="preview-workspace"><div class="preview-zone movement-zone"><div class="movement-head"><h2 data-i18n="preview.field">프리뷰</h2><div class="movement-scale-control" id="movement-scale-control" role="group" aria-label="프리뷰 렌더링 크기" data-i18n-aria="preview.render_size"><span data-i18n="preview.render_size">렌더링 크기</span><button type="button" data-movement-scale="1" aria-pressed="false">x1</button><button type="button" data-movement-scale="1.5" aria-pressed="false">x1.5</button><button class="active" type="button" data-movement-scale="2" aria-pressed="true">x2</button></div></div><div class="movement-canvas-wrap"><canvas id="movement-canvas" width="640" height="360" tabindex="0" aria-label="방향키로 이동하고 Space 키로 물풍선을 놓는 프리뷰" data-i18n-aria="preview.canvas_aria"></canvas><p class="movement-empty" id="movement-empty" data-i18n="character.select_prompt">캐릭터를 선택하세요</p></div></div><div class="preview-zone slot-zone"><div class="preview-zone-title"><h2 data-i18n="preview.slot">슬롯</h2><button class="render-button title-gif-button" id="render" type="button" aria-label="슬롯 GIF 저장" data-i18n-aria="gif.slot_save">GIF</button></div><div class="stage"><canvas id="stage-canvas" width="148" height="148"></canvas></div></div><div class="id-deco-zone"><div class="preview-zone-title"><h2 data-i18n="category.id_deco">아이디치장</h2><button class="render-button title-gif-button" id="render-id-deco" type="button" aria-label="아이디치장 GIF 저장" data-i18n-aria="gif.id_deco_save" disabled>GIF</button></div><div class="id-deco-palette"><div class="palette-labels"><span data-i18n="palette.lobby">로비</span><span data-i18n="palette.in_game">게임 안</span></div><div class="id-deco-stage"><canvas class="id-deco-canvas" id="id-deco-canvas" width="380" height="88"></canvas></div></div></div></div></div>
