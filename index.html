<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Poptag-Viewer</title>
  <style>
    :root {
      --bg:#080b12; --panel:#101624; --panel2:#171f31; --line:#28364e;
      --text:#f4f7fb; --muted:#9aa8bd; --cyan:#62e4ff; --yellow:#ffdf63;
      --card:270px; --thumb:180px;
    }
    * { box-sizing:border-box; }
    html { scrollbar-color:#42516c #0b0f18; }
    body { margin:0; color:var(--text); background:radial-gradient(circle at 75% -10%,#173150 0,transparent 32rem),var(--bg); font-family:"Malgun Gothic","Noto Sans KR",system-ui,sans-serif; }
    button,input,select { font:inherit; }
    button { color:inherit; }
    header { position:sticky; top:0; z-index:20; padding:18px 24px 14px; background:rgba(8,11,18,.94); border-bottom:1px solid var(--line); backdrop-filter:blur(18px); }
    .top { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:14px; }
    .brand-line { display:flex; align-items:center; gap:14px; min-width:0; }
    h1 { margin:0; font-size:clamp(1.35rem,3vw,2rem); letter-spacing:-.04em; }
    .count { color:var(--cyan); font-weight:800; }
    .tryon-button { min-height:48px; padding:0 24px; color:#061017; background:linear-gradient(135deg,#75ebff,#43d5f5); border:1px solid #8ff0ff; border-radius:13px; cursor:pointer; box-shadow:0 8px 24px rgba(76,218,247,.22),inset 0 1px rgba(255,255,255,.45); font-size:1.02rem; font-weight:900; white-space:nowrap; transition:.16s transform,.16s box-shadow; }
    .tryon-button:hover { transform:translateY(-2px); box-shadow:0 12px 30px rgba(76,218,247,.32),inset 0 1px rgba(255,255,255,.5); }
    .tryon-button.active { color:#fff; background:linear-gradient(135deg,#276486,#173e62); border-color:var(--cyan); }
    .tab-stack { display:grid; gap:7px; margin-bottom:12px; }
    .tabs { display:flex; gap:7px; margin:0; overflow-x:auto; scrollbar-width:thin; }
    .tab { min-height:40px; padding:0 16px; color:var(--muted); background:#111827; border:1px solid var(--line); border-radius:999px; cursor:pointer; white-space:nowrap; font-weight:800; }
    .tab.active { color:#071019; background:var(--cyan); border-color:var(--cyan); }
    .controls { display:grid; grid-template-columns:minmax(220px,1fr) auto auto auto; gap:9px; }
    .control { min-height:44px; color:var(--text); background:var(--panel); border:1px solid var(--line); border-radius:11px; padding:0 13px; }
    .character-filter { min-width:220px; }
    .character-filter[hidden] { display:none; }
    input:focus,select:focus,button:focus-visible { outline:2px solid var(--cyan); outline-offset:2px; }
    main { padding:22px 24px 80px; }
    #grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,var(--card)),1fr)); gap:14px; }
    .card { min-width:0; padding:0; overflow:hidden; text-align:left; color:inherit; background:linear-gradient(145deg,var(--panel2),var(--panel)); border:1px solid var(--line); border-radius:14px; cursor:pointer; box-shadow:0 10px 30px rgba(0,0,0,.18); transition:.16s transform,.16s border-color,.16s box-shadow; }
    .card:hover { transform:translateY(-3px); border-color:#527195; box-shadow:0 14px 35px rgba(0,0,0,.3); }
    .preview-shell,.full-shell,.stage { background-color:#dfe5ec; background-image:linear-gradient(45deg,#b8c2cd 25%,transparent 25%),linear-gradient(-45deg,#b8c2cd 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#b8c2cd 75%),linear-gradient(-45deg,transparent 75%,#b8c2cd 75%); background-size:16px 16px; background-position:0 0,0 8px,8px -8px,-8px 0; }
    .preview-shell { height:var(--thumb); min-width:0; min-height:0; display:grid; place-items:center; overflow:hidden; padding:10px; border-bottom:1px solid var(--line); }
    .thumb { width:auto; height:100%; max-width:100%; max-height:100%; aspect-ratio:1; display:block; image-rendering:pixelated; }
    .body { padding:12px 13px 14px; }
    .row { display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .code { min-width:0; color:var(--yellow); font-size:1.02rem; font-weight:900; letter-spacing:.025em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .badge { flex:0 0 auto; padding:4px 7px; border-radius:999px; color:#c2d3ea; background:#202b40; font-size:.75rem; }
    .name { height:2.8em; margin-top:8px; line-height:1.4; overflow:hidden; font-size:.9rem; overflow-wrap:anywhere; }
    .resource { margin-top:8px; color:var(--muted); font:.76rem/1.3 ui-monospace,Consolas,monospace; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .unlinked { border-color:#5b4535; }
    .unlinked .name { color:#deb583; }
    .empty { grid-column:1/-1; padding:16vh 20px; text-align:center; color:var(--muted); }
    #composer { display:none; grid-template-columns:minmax(300px,420px) minmax(210px,260px) minmax(300px,1fr); align-items:start; gap:16px; max-width:1280px; margin:0 auto; }
    .stage-panel,.pick-panel { background:linear-gradient(145deg,var(--panel2),var(--panel)); border:1px solid var(--line); border-radius:16px; padding:18px; }
    .stage { width:min(100%,520px); aspect-ratio:1; margin:auto; overflow:hidden; border:1px solid #526580; border-radius:12px; background-size:24px 24px; background-position:0 0,0 12px,12px -12px,-12px 0; }
    #stage-canvas { width:100%; height:100%; display:block; image-rendering:pixelated; }
    .picker { margin-bottom:15px; }
    .picker label { display:block; margin-bottom:6px; color:var(--yellow); font-weight:800; }
    .picker select { width:100%; min-height:45px; color:var(--text); background:#0f1624; border:1px solid var(--line); border-radius:10px; padding:0 10px; }
    .picker select:disabled { color:#738096; cursor:not-allowed; }
    .picker-section + .picker-section { margin-top:20px; padding-top:18px; border-top:1px solid var(--line); }
    .picker-section h2 { margin:0 0 14px; color:var(--cyan); font-size:1rem; }
    .costume-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); column-gap:12px; }
    .color-choice { display:grid; grid-template-columns:minmax(0,1fr) 45px; gap:8px; }
    .color-swatch { border:1px solid #526580; border-radius:10px; box-shadow:inset 0 0 0 4px rgba(255,255,255,.1); }
    .render-button,.primary { width:100%; min-height:48px; color:#061017; background:var(--cyan); border:0; border-radius:11px; cursor:pointer; font-weight:900; }
    dialog { width:min(1180px,94vw); max-height:92vh; padding:0; color:var(--text); background:#0d1320; border:1px solid #435472; border-radius:16px; box-shadow:0 30px 90px #000; }
    dialog::backdrop { background:rgba(0,0,0,.76); backdrop-filter:blur(5px); }
    .modal-head { position:sticky; top:0; z-index:2; display:flex; align-items:center; justify-content:space-between; gap:16px; padding:14px 16px; background:rgba(13,19,32,.96); border-bottom:1px solid var(--line); }
    .modal-title { min-width:0; }
    .modal-title strong { color:var(--yellow); font-size:1.1rem; }
    .modal-title span { display:block; margin-top:3px; color:var(--muted); font-size:.82rem; overflow-wrap:anywhere; }
    .modal-actions { display:flex; align-items:center; gap:8px; }
    .try-button { min-height:42px; padding:0 16px; color:#061017; background:var(--cyan); border:0; border-radius:11px; cursor:pointer; font-weight:900; }
    .close { width:42px; height:42px; flex:0 0 auto; color:white; background:#202b40; border:1px solid #3a4963; border-radius:11px; cursor:pointer; font-size:1.35rem; }
    .modal-content { padding:18px; overflow:auto; }
    .full-shell { width:100%; height:min(62vh,620px); min-width:0; min-height:0; display:grid; place-items:center; overflow:hidden; padding:16px; border-radius:10px; background-size:20px 20px; background-position:0 0,0 10px,10px -10px,-10px 0; }
    #modal-canvas { width:auto; height:100%; max-width:100%; max-height:100%; aspect-ratio:1; display:block; image-rendering:pixelated; }
    .details { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin-top:14px; }
    .detail { min-width:0; padding:12px; background:#151d2c; border:1px solid var(--line); border-radius:10px; }
    .detail small { display:block; color:var(--muted); margin-bottom:5px; }
    .detail div { overflow-wrap:anywhere; }
    .resource-gate { position:fixed; inset:0; z-index:100; display:grid; place-items:center; padding:20px; background:rgba(5,8,14,.94); backdrop-filter:blur(16px); }
    .resource-gate.ready { display:none; }
    .resource-gate > .primary { width:min(360px,100%); box-shadow:0 24px 80px #000; }
    @media (max-width:980px) { #composer { grid-template-columns:minmax(280px,420px) minmax(260px,1fr); max-width:900px; } .stage-panel { grid-row:1 / span 2; } .character-panel,.item-panel { grid-column:2; } }
    @media (max-width:760px) { header,main { padding-left:14px; padding-right:14px; } .top { gap:10px; } .brand-line { gap:10px; } .tryon-button { min-height:44px; padding:0 17px; } .count { font-size:.86rem; } .controls { grid-template-columns:1fr 1fr; } .controls input,.character-filter { grid-column:1/-1; } .details { grid-template-columns:1fr 1fr; } .preview-shell { height:min(var(--thumb),70vw); } #composer { grid-template-columns:1fr; } .stage-panel,.character-panel,.item-panel { grid-column:auto; grid-row:auto; } .costume-grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <aside class="resource-gate" id="resource-gate" aria-modal="true" role="dialog">
    <button class="primary" id="choose-folder" type="button">PopTag 폴더 선택</button>
    <input id="idd-files" type="file" webkitdirectory directory multiple hidden>
  </aside>
  <header>
    <div class="top"><div class="brand-line"><h1>Poptag-Viewer</h1><button class="tryon-button" id="tryon-tab" type="button" data-category="tryon">입혀보기</button></div><div class="count" id="count"></div></div>
    <nav class="tab-stack" aria-label="종류 선택" id="tabs"><div class="tabs" id="base-tabs"></div><div class="tabs" id="costume-tabs"></div></nav>
    <div class="controls" id="controls">
      <input class="control" id="search" type="search" placeholder="번호, 이름, 리소스 검색" autocomplete="off">
      <select class="control" id="sort" aria-label="정렬"><option value="code">번호순</option><option value="frames">프레임 많은 순</option><option value="name">이름순</option></select>
      <select class="control" id="size" aria-label="카드 크기"><option value="170">작게</option><option value="270" selected>보통</option><option value="520">크게</option></select>
      <select class="control character-filter" id="character-filter" aria-label="미리보기 캐릭터" hidden><option value="">전체 캐릭터</option></select>
    </div>
  </header>
  <main>
    <section id="grid" aria-live="polite"></section>
    <section id="composer">
      <div class="stage-panel"><div class="stage"><canvas id="stage-canvas" width="148" height="148"></canvas></div></div>
      <div class="pick-panel character-panel" id="character-pickers"></div>
      <div class="pick-panel item-panel"><div class="picker-section"><h2>캐릭터 코스튬</h2><div class="costume-grid" id="costume-pickers"></div></div><div class="picker-section"><h2>슬롯 꾸미기</h2><div id="pickers"></div></div></div>
    </section>
  </main>
  <dialog id="viewer">
    <div class="modal-head"><div class="modal-title"><strong id="vcode"></strong><span id="vname"></span></div><div class="modal-actions"><button class="try-button" id="try-item" type="button">입혀보기</button><button class="close" id="close" type="button" aria-label="닫기">×</button></div></div>
    <div class="modal-content"><div class="full-shell"><canvas id="modal-canvas" width="148" height="148"></canvas></div><div class="details" id="details"></div></div>
  </dialog>
  <script src="catalog-data.js?v=20260904-4"></script>
  <script src="characters-data.js?v=20260904-4"></script>
  <script src="costumes-data.js?v=20260904-4"></script>
  <script src="resource-data.js?v=20260904-4"></script>
  <script src="viewer.js?v=20260904-4"></script>
</body>
</html>
